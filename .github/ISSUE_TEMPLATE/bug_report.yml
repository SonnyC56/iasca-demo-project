name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Desktop, Phone, Tablet]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs
